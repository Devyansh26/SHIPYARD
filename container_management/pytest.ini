[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: fast, isolated unit tests (no I/O)
    integration: drive the real FastAPI app over ASGI with fakes/mocks
    docker: needs a reachable Docker daemon; auto-skips when absent
    db: needs a live PostgreSQL database (Neon TEST branch) via DATABASE_URL; auto-skips when unset
    slow: long-running / resource-intensive tests (OOM, large payloads)
