# Type-checking configuration for the Container Management Service.
#
# `plugins = pydantic.mypy` is essential: without it mypy cannot see the
# camelCase `alias`/`populate_by_name` constructor keywords that every DTO and
# document model relies on, and reports them as bogus "unexpected keyword
# argument" errors.
[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
warn_unused_ignores = True
show_error_codes = True
